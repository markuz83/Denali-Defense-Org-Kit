<template>
    <div class="command-center">
        <template lwc:if={showPicker}>
            <lightning-card title="Account Command Center" icon-name="standard:account" class="slds-show">
                <div class="slds-var-p-horizontal_medium picker">
                    <template lwc:if={pickerReady}>
                        <lightning-combobox label="Account" placeholder="Select an account" options={accountOptions}
                            value={accountId} onchange={handleAccountPicked}></lightning-combobox>
                    </template>
                    <template lwc:elseif={pickerEmpty}>
                        <p class="slds-text-color_weak">No active customer accounts.</p>
                    </template>
                </div>
            </lightning-card>
        </template>

        <template lwc:if={isLoading}>
            <div class="spinner-holder slds-is-relative">
                <lightning-spinner alternative-text="Loading account" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-var-m-bottom_small" role="alert">
                <h2>{error}</h2>
            </div>
        </template>

        <template lwc:if={hasData}>
            <!-- Header -->
            <lightning-card class={headerCardClass}>
                <div slot="title" class="header-title slds-grid slds-wrap slds-grid_vertical-align-center">
                    <lightning-icon icon-name="standard:account" size="small" class="slds-var-m-right_small"></lightning-icon>
                    <span class="slds-text-heading_medium">{account.Name}</span>
                    <template for:each={roleBadges} for:item="role">
                        <lightning-badge key={role} label={role} class="slds-var-m-left_x-small"></lightning-badge>
                    </template>
                    <lightning-badge label={healthLabel} class={healthBadgeClass}></lightning-badge>
                </div>
                <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
                <template lwc:if={live}><span class="live" title="Updates automatically when deliverables or supplier updates change">● Live</span></template>
                <lightning-button-group>
                    <lightning-button label="New Risk" icon-name="utility:warning" onclick={handleNewRisk}></lightning-button>
                    <lightning-button label="New Case" icon-name="utility:case" onclick={handleNewCase}></lightning-button>
                    <template lwc:if={showPicker}>
                        <lightning-button label="Open Account" onclick={handleOpenAccount}></lightning-button>
                    </template>
                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh"
                        onclick={handleRefresh}></lightning-button-icon>
                </lightning-button-group>
                </div>
                <div class="slds-var-p-horizontal_medium">
                    <p class="slds-text-color_weak slds-var-m-bottom_small">{subtitle}</p>
                    <div class="kpis">
                        <template for:each={kpis} for:item="kpi">
                            <div key={kpi.key} class={kpi.className}>
                                <div class="kpi-label">{kpi.label}</div>
                                <div class="kpi-value">{kpi.value}</div>
                                <div class="kpi-sub">{kpi.sub}</div>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <!-- Contracts -->
            <template lwc:if={hasContracts}>
                <div class={contractsClass}>
                    <template for:each={contractCards} for:item="c">
                        <article key={c.id} class="slds-card slds-m-around_none">
                            <div class="contract-body slds-card__body slds-card__body_inner">
                                <div>
                                    <div class="contract-head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <a href={c.url} class="slds-text-heading_small">{c.title}</a>
                                        <lightning-badge label={c.status} class={c.statusClass}></lightning-badge>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak">{c.subtitle}</p>
                                    <div class="contract-value">{c.value}</div>
                                </div>
                                <div>
                                    <div class="funding-bar slds-grid slds-scrollable_none" title="Recognized / funded, not yet recognized / unfunded">
                                        <span class="seg slds-show seg-recognized" style={c.recognizedStyle}></span>
                                        <span class="seg slds-show seg-funded" style={c.fundedStyle}></span>
                                    </div>
                                    <div class="funding-legend slds-grid slds-wrap slds-text-body_small">
                                        <span><span class="dot slds-show_inline-block dot-recognized"></span>Recognized {c.recognized}</span>
                                        <span><span class="dot slds-show_inline-block dot-funded"></span>Funded {c.fundedOpen}</span>
                                        <span><span class="dot slds-show_inline-block dot-unfunded"></span>Unfunded {c.unfunded}</span>
                                    </div>
                                </div>
                                <div>
                                    <template lwc:if={c.hasMargin}>
                                        <div class="margin-line slds-text-body_small">{c.marginText}<template lwc:if={c.hasVariance}><span class={c.varianceClass}>{c.varianceText}</span></template></div>
                                    </template>
                                    <template lwc:if={c.optionLabel}>
                                        <lightning-badge label={c.optionLabel} class={c.optionClass}></lightning-badge>
                                    </template>
                                </div>
                            </div>
                        </article>
                    </template>
                </div>
            </template>

            <!-- Delivery tree -->
            <lightning-card title="Contracts, Projects & Deliverables" icon-name="custom:custom63" class="slds-show slds-var-m-top_small">
                <div slot="actions">
                    <lightning-input type="toggle" label="At risk or overdue only" message-toggle-active=""
                        message-toggle-inactive="" checked={atRiskOnly} onchange={handleAtRiskToggle}></lightning-input>
                </div>
                <div class="slds-var-p-horizontal_small">
                    <template lwc:if={hasTreeData}>
                        <lightning-tree-grid key-field="id" columns={treeColumns} data={treeData}
                            expanded-rows={expandedRows} hide-checkbox-column
                            column-widths-mode="auto"></lightning-tree-grid>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-var-p-around_small">{treeEmptyMessage}</p>
                    </template>
                </div>
            </lightning-card>

            <!-- Timeline -->
            <div class="slds-var-m-top_small">
                <c-command-center-timeline title="Delivery Timeline" items={timelineItems}
                    empty-message="No dated deliverables on this account."></c-command-center-timeline>
            </div>

            <!-- Risk + service -->
            <div class="two-up two-up_narrow-wide slds-var-m-top_small">
                <div class="slds-no-space">
                    <c-command-center-risk-heatmap risks={data.risks}></c-command-center-risk-heatmap>
                </div>
                <div class="slds-no-space">
                    <lightning-card title="Service" icon-name="standard:service_contract" class="slds-show">
                        <div class="slds-var-p-horizontal_small">
                            <template lwc:if={hasService}>
                                <c-health-datatable key-field="id" columns={serviceColumns} data={serviceRows}
                                    hide-checkbox-column></c-health-datatable>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-var-p-around_small">No service engagements.</p>
                            </template>
                            <h3 class="slds-text-title_caps slds-var-m-top_medium slds-var-m-bottom_x-small slds-var-p-left_x-small">Open Cases</h3>
                            <template lwc:if={hasCases}>
                                <lightning-datatable key-field="id" columns={caseColumns} data={caseRows}
                                    hide-checkbox-column></lightning-datatable>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-var-p-around_small">No open cases.</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>
    </div>
</template>
